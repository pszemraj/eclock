[package]
name = "eclock"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A minimal, low-power desktop clock built with egui/eframe."
publish = false

[features]
inspection = ["eframe/inspection"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
iana-time-zone = "0.1.65"
resvg = { version = "0.47.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
